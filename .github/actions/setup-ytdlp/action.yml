name: Setup yt-dlp
description: Install the yt-dlp standalone binary (no Python, no pip resolver).

runs:
  using: composite
  steps:
    - name: Install yt-dlp
      shell: bash
      run: |
        set -euo pipefail

        if command -v yt-dlp >/dev/null 2>&1; then
          echo "already present: $(yt-dlp --version)"
          exit 0
        fi

        # The official `yt-dlp_linux` build is a single self-contained binary
        # (Python included), so there is no pip resolver to fight and no Python
        # version to pin. `latest` on purpose: the extractors break whenever
        # YouTube changes something, and a pinned build rots within weeks.
        URL="https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux"
        OK=0
        for i in 1 2 3; do
          echo "yt-dlp download attempt $i"
          if sudo curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 \
               -o /usr/local/bin/yt-dlp "$URL"; then
            sudo chmod 0755 /usr/local/bin/yt-dlp
            OK=1
            break
          fi
          sleep 5
        done

        if [ "$OK" != "1" ]; then
          echo "could not install yt-dlp" >&2
          exit 1
        fi

        yt-dlp --version
