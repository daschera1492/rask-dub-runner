name: Setup ffmpeg
description: Install ffmpeg + ffprobe (static build, apt fallback).

runs:
  using: composite
  steps:
    - name: Install ffmpeg
      shell: bash
      run: |
        set -euo pipefail

        if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
          echo "already present: $(ffmpeg -version | head -n 1)"
          exit 0
        fi

        URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
        TMP="$(mktemp -d)"
        OK=0

        for i in 1 2 3; do
          echo "static download attempt $i"
          if curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 \
               -o "$TMP/ffmpeg.tar.xz" "$URL" \
             && tar -xJf "$TMP/ffmpeg.tar.xz" -C "$TMP"; then
            OK=1
            break
          fi
          sleep 5
        done

        if [ "$OK" = "1" ]; then
          BIN="$(dirname "$(find "$TMP" -type f -name ffmpeg -print -quit)")"
          sudo install -m 0755 "$BIN/ffmpeg"  /usr/local/bin/ffmpeg
          sudo install -m 0755 "$BIN/ffprobe" /usr/local/bin/ffprobe
          rm -rf "$TMP"
          echo "installed static build into /usr/local/bin"
        else
          echo "static download failed -> apt fallback"
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                       -o DPkg::Lock::Timeout=120 update
          DEBIAN_FRONTEND=noninteractive sudo apt-get -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120 \
            install -y --no-install-recommends ffmpeg
        fi

        ffmpeg  -version | head -n 1
        ffprobe -version | head -n 1
