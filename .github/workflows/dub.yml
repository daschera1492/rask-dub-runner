# Rask dub — audio-only pipeline.
#
# Only the audio track leaves the runner. Rask dubs each <=1 minute chunk, the
# dubbed track is downloaded, fitted to its original slot and muxed back onto
# the untouched source video locally (`-c:v copy`). No picture ever reaches
# Rask, and the output is watermark-free.
#
# Accounts: every chunk is dubbed on a throw-away account made from an
# emailnator Gmail address (Cognito signup + emailed code). A fresh account
# carries 3 dubbing minutes / 5 projects, and each project is billed as one
# minute, so ~3 chunks per account. The runner opens accounts as needed.
#
# Caveat: the emailnator inbox is public — only ever used for the one-time code.

name: Rask dub

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک ویدیو — آدرس مستقیم فایل (mp4 / mov / mkv) یا مسیر محلی'
        required: true
        type: string
      target_lang:
        description: 'زبان مقصد (Rask)'
        required: true
        default: 'Persian'
        type: choice
        options:
          - 'Persian'
          - 'English'
          - 'Arabic'
          - 'Turkish'
          - 'German'
          - 'French'
          - 'Spanish'
          - 'Italian'
          - 'Russian'
          - 'Hindi'
          - 'Urdu'
          - 'Chinese'
          - 'Japanese'
          - 'Korean'
          - 'Portuguese'
          - 'Dutch'
          - 'Polish'
          - 'Ukrainian'
          - 'Azerbaijani'
      chunk_seconds:
        description: 'طول هر تکه — هر پروژه یک دقیقه اعتبار مصرف می‌کند، پس نزدیک ۶۰ ثانیه بهترین بازدهی است'
        required: true
        default: '55'
        type: choice
        options:
          - '55'
          - '50'
          - '45'
          - '40'
          - '30'
      parallel_chunks:
        description: 'هم‌زمانی — چند پروژه با هم روی یک اکانت ساخته شود'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      max_chunks:
        description: 'فقط تست — فقط N تکهٔ اول دوبله شود (0 = همه)'
        required: false
        default: '0'
        type: string
      max_accounts:
        description: 'سقف اکانت‌های موقت (هر اکانت ~۳ تکه)'
        required: false
        default: '20'
        type: string
      otp_wait_seconds:
        description: 'چند ثانیه برای کد ایمیل صبر شود'
        required: false
        default: '180'
        type: string
      allow_partial:
        description: 'تکه‌های ناموفق را با سکوت پر کن و اجرا را شکست نده'
        required: false
        default: false
        type: boolean
      output_name:
        description: 'نام فایل خروجی (خالی = نام ویدیو + کد زبان)'
        required: false
        default: ''
        type: string
      queue_group:
        description: 'اختیاری — اجراهایی با این مقدار یکسان پشت سر هم می‌روند؛ خالی = موازی'
        required: false
        default: ''
        type: string
      publish:
        description: 'در پایان، mp3 و mp4 را جدا روی Release بگذار (حذف خودکار بعد از ۳۰ روز)'
        required: false
        default: true
        type: boolean
      proxy_enabled:
        description: 'پروکسی Oxylabs — true = هر اکانت با IP residential جدا، false = IP خود رانر'
        required: true
        default: true
        type: boolean
      proxy_countries:
        description: 'کشور پروکسی (کد دو حرفی، با کاما) — auto = us,de,nl,gb'
        required: false
        default: 'auto'
        type: string

permissions:
  contents: write

concurrency:
  group: rask-dub-${{ inputs.queue_group != '' && inputs.queue_group || github.run_id }}
  cancel-in-progress: false

jobs:
  dub:
    # ubuntu-latest moved to 26.04, where ffmpeg is missing and apt repos are
    # unreachable. Pin 24.04 (ffmpeg preinstalled) and keep the static-build
    # fallback in scripts/install-ffmpeg.sh.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg
        timeout-minutes: 12
        run: |
          sed -i 's/\r$//' scripts/install-ffmpeg.sh
          bash scripts/install-ffmpeg.sh

      # Better chunk boundaries (cuts in pauses instead of mid-sentence).
      # Optional: the runner falls back to ffmpeg silencedetect when absent.
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-base-rask

      - name: Install Whisper (optional)
        continue-on-error: true
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --quiet openai-whisper

      - name: Dub
        id: dub
        env:
          INPUT_URL: ${{ inputs.video_url }}
          TARGET_LANG: ${{ inputs.target_lang }}
          CHUNK_SECONDS: ${{ inputs.chunk_seconds }}
          PARALLEL_CHUNKS: ${{ inputs.parallel_chunks }}
          MAX_CHUNKS: ${{ inputs.max_chunks }}
          MAX_ACCOUNTS: ${{ inputs.max_accounts }}
          OTP_WAIT_SECONDS: ${{ inputs.otp_wait_seconds }}
          ALLOW_PARTIAL: ${{ inputs.allow_partial }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          # emailnator: 3 = ".Gmail" dot alias only
          EMAILNATOR_IDS: '3'
          EMAILNATOR_POLL_SECONDS: '4'
          # Cloud runner IPs are throttled by emailnator; ride the proxy.
          EMAILNATOR_PROXY: ${{ inputs.proxy_enabled && '1' || '0' }}
          # Oxylabs residential proxy: one sticky exit IP per account.
          PROXY_OXYLABS: ${{ secrets.PROXY_OXYLABS }}
          PROXY_ENABLED: ${{ inputs.proxy_enabled }}
          PROXY_COUNTRIES: ${{ inputs.proxy_countries == 'auto' && 'us,de,nl,gb' || inputs.proxy_countries }}
          WORK_DIR: ${{ runner.temp }}/work
        run: node scripts/run.mjs

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rask-output
          path: |
            ${{ runner.temp }}/work/out
            ${{ runner.temp }}/work/state.json
          if-no-files-found: warn

      # mp3 و mp4 جدا روی Release می‌روند:
      #   - mp4: تصویر همان خروجی دوبله، با -c:v copy
      #   - mp3: صدای دوبله، دقیقاً هم‌طول ویدیو (sample-accurate، drift صفر)
      # حذف: ورک‌فلو «cleanup» هر روز ریلیزهای قدیمی‌تر از RETENTION_DAYS را پاک می‌کند.
      - name: Publish release (mp3 + mp4)
        if: ${{ inputs.publish && contains(steps.dub.outputs.video_path, '.mp4') }}
        env:
          INPUT_VIDEO: ${{ steps.dub.outputs.video_path }}
          INPUT_AUDIO: ${{ steps.dub.outputs.audio_path }}
          OUTPUT_NAME: ${{ steps.dub.outputs.name }}
          AUDIO_OFFSET_MS: '0'
          RELEASE: '1'
          RELEASE_TAG: sync-${{ github.run_number }}
          RELEASE_TITLE: ${{ steps.dub.outputs.name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORK_DIR: ${{ runner.temp }}/sync-work
          OUT_DIR: ${{ runner.temp }}/sync-out
        run: node sync/scripts/sync.mjs

      - name: Link
        if: always()
        run: |
          {
            echo '### Result'
            echo ''
            echo "- file: \`${{ steps.dub.outputs.video_path }}\`"
            echo "- duration: ${{ steps.dub.outputs.duration }}s"
            echo "- chunks: ${{ steps.dub.outputs.chunks }}"
            echo "- accounts: ${{ steps.dub.outputs.accounts }}"
            if [ -n "${{ steps.dub.outputs.video_path }}" ] && [ "${{ inputs.publish }}" = "true" ]; then
              echo "- release: https://github.com/${{ github.repository }}/releases/tag/sync-${{ github.run_number }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
