# Rask dub — audio-only pipeline, split over parallel runners.
#
#   1. prepare   one runner: download the source, find the cuts (Whisper), cut
#                the audio chunks, write plan.json, publish them as an artifact.
#   2. dub       N runners in a matrix: each one dubs its own shard of the
#                timeline with its own throw-away Rask accounts, then uploads
#                the finished chunks. Different runner = different IP, so the
#                Rask/emailnator limits are spread instead of serialised.
#   3. merge     one runner: collect every shard, put the original audio back
#                for chunks that could not be dubbed, concatenate the timeline
#                sample-accurately, mux onto the untouched video (-c:v copy) and
#                publish BOTH the .mp4 and the dubbed .mp3 to a GitHub Release.
#
# Accounts: every third chunk is dubbed on a throw-away account made from an
# emailnator Gmail address (Cognito signup + emailed code). A fresh account
# carries 3 dubbing minutes / 5 projects, and each project is billed as one
# minute.
#
# Caveat: the emailnator inbox is public — only ever used for the one-time code.

name: Rask dub

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک ویدیو — آدرس مستقیم فایل (mp4 / mov / mkv) یا مسیر محلی'
        required: true
        type: string
      target_lang:
        description: 'زبان مقصد (Rask)'
        required: true
        default: 'Persian'
        type: choice
        options:
          - 'Persian'
          - 'English'
          - 'Arabic'
          - 'Turkish'
          - 'German'
          - 'French'
          - 'Spanish'
          - 'Italian'
          - 'Russian'
          - 'Hindi'
          - 'Urdu'
          - 'Chinese'
          - 'Japanese'
          - 'Korean'
          - 'Portuguese'
          - 'Dutch'
          - 'Polish'
          - 'Ukrainian'
          - 'Azerbaijani'
      chunk_seconds:
        description: 'طول هر تکه — هر پروژه یک دقیقه اعتبار مصرف می‌کند، پس نزدیک ۶۰ ثانیه بهترین بازدهی است'
        required: true
        default: '55'
        type: choice
        options:
          - '55'
          - '50'
          - '45'
          - '40'
          - '30'
      parallel_chunks:
        description: 'هم‌زمانی روی هر رانر — چند پروژه با هم روی یک اکانت'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      parallel_runners:
        description: 'تعداد رانرهای هم‌زمان (تکه‌ها بین این‌ها تقسیم می‌شود)'
        required: true
        default: '6'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
          - '8'
      retry_rounds:
        description: 'دورهای تلاش مجدد انتهای کار برای تکه‌های ناموفق (هر دور با اکانت تازه)'
        required: true
        default: '2'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'
      on_fail:
        description: 'تکه‌ای که دوبله نشد: original = صدای اصلی حفظ شود، silence = سکوت، error = اجرا شکست بخورد'
        required: true
        default: 'original'
        type: choice
        options:
          - 'original'
          - 'silence'
          - 'error'
      max_chunks:
        description: 'فقط تست — فقط N تکهٔ اول (0 = همه)'
        required: false
        default: '0'
        type: string
      max_accounts:
        description: 'سقف اکانت‌ها برای هر رانر (0 = خودکار، حدود یک اکانت per ۳ تکه)'
        required: false
        default: '0'
        type: string
      otp_wait_seconds:
        description: 'چند ثانیه برای کد ایمیل صبر شود'
        required: false
        default: '180'
        type: string
      output_name:
        description: 'نام فایل خروجی (خالی = نام ویدیو + کد زبان)'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'انتشار خروجی (mp4 + mp3) روی GitHub Release'
        required: true
        default: true
        type: boolean
      queue_group:
        description: 'اختیاری — اجراهایی با این مقدار یکسان پشت سر هم می‌روند؛ خالی = موازی'
        required: false
        default: ''
        type: string
      proxy_enabled:
        description: 'پروکسی Oxylabs — true = هر اکانت با IP residential جدا'
        required: true
        default: true
        type: boolean
      proxy_countries:
        description: 'کشور پروکسی (کد دو حرفی، با کاما) — auto = us,de,nl,gb'
        required: false
        default: 'auto'
        type: string

permissions:
  contents: write

concurrency:
  group: rask-dub-${{ inputs.queue_group != '' && inputs.queue_group || github.run_id }}
  cancel-in-progress: false

env:
  TARGET_LANG: ${{ inputs.target_lang }}
  CHUNK_SECONDS: ${{ inputs.chunk_seconds }}
  PARALLEL_CHUNKS: ${{ inputs.parallel_chunks }}
  PARALLEL_RUNNERS: ${{ inputs.parallel_runners }}
  RETRY_ROUNDS: ${{ inputs.retry_rounds }}
  ON_FAIL: ${{ inputs.on_fail }}
  MAX_CHUNKS: ${{ inputs.max_chunks }}
  MAX_ACCOUNTS: ${{ inputs.max_accounts }}
  OTP_WAIT_SECONDS: ${{ inputs.otp_wait_seconds }}
  OUTPUT_NAME: ${{ inputs.output_name }}
  # emailnator: 3 = ".Gmail" dot alias only
  EMAILNATOR_IDS: '3'
  EMAILNATOR_POLL_SECONDS: '4'
  # Cloud runner IPs are throttled by emailnator; ride the account's proxy.
  EMAILNATOR_PROXY: ${{ inputs.proxy_enabled && '1' || '0' }}
  # Oxylabs residential proxy: one sticky exit IP per account.
  PROXY_OXYLABS: ${{ secrets.PROXY_OXYLABS }}
  PROXY_ENABLED: ${{ inputs.proxy_enabled }}
  PROXY_COUNTRIES: ${{ inputs.proxy_countries == 'auto' && 'us,de,nl,gb' || inputs.proxy_countries }}

jobs:
  # ------------------------------------------------------------------ #
  # 1. Plan + cut                                                       #
  # ------------------------------------------------------------------ #
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      shards: ${{ steps.prepare.outputs.shards }}
      chunks: ${{ steps.prepare.outputs.chunks }}
      duration: ${{ steps.prepare.outputs.duration }}
    steps:
      - uses: actions/checkout@v4

      # `runner` is not available in a job-level `env` block, so the work
      # directory is exported for the rest of the job here.
      - name: Work directory
        run: echo "WORK_DIR=$RUNNER_TEMP/work" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: ./.github/actions/setup-ffmpeg

      # Pure node, no network, no ffmpeg: catches a broken account pool before
      # any addresses or minutes are spent.
      - name: Test account pool and publish guard
        run: node test/dub-queue.test.mjs

      # Better chunk boundaries (cuts in pauses instead of mid-sentence).
      # Optional: the runner falls back to ffmpeg silencedetect when absent.
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-base-rask

      - name: Install Whisper (optional)
        continue-on-error: true
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --quiet openai-whisper

      - name: Prepare plan
        id: prepare
        env:
          INPUT_URL: ${{ inputs.video_url }}
        run: node scripts/prepare.mjs

      - name: Upload plan + chunks
        uses: actions/upload-artifact@v4
        with:
          name: rask-plan
          path: |
            ${{ runner.temp }}/work/plan.json
            ${{ runner.temp }}/work/chunks
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ #
  # 2. Dub — one job per shard, all at the same time                    #
  # ------------------------------------------------------------------ #
  dub:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      # `runner` is not available in a job-level `env` block.
      - name: Work directory
        run: echo "WORK_DIR=$RUNNER_TEMP/work" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: ./.github/actions/setup-ffmpeg

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: rask-plan
          path: ${{ runner.temp }}/work

      - name: Dub shard ${{ matrix.shard }}
        id: dub
        run: node scripts/dub-worker.mjs

      - name: Upload dubbed chunks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rask-dub-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/work/dub
            ${{ runner.temp }}/work/reports
            !${{ runner.temp }}/work/dub/*-raw.mp3
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------------------------ #
  # 3. Merge + publish                                                  #
  # ------------------------------------------------------------------ #
  merge:
    needs: [prepare, dub]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # `runner` is not available in a job-level `env` block.
      - name: Work directory
        run: echo "WORK_DIR=$RUNNER_TEMP/work" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: ./.github/actions/setup-ffmpeg

      - name: Download plan + chunks
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: rask-plan
          path: ${{ runner.temp }}/work

      - name: Download every dubbed shard
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: rask-dub-*
          path: ${{ runner.temp }}/work
          merge-multiple: true

      - name: Merge
        id: merge
        env:
          INPUT_URL: ${{ inputs.video_url }}
        run: node scripts/merge.mjs

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rask-output
          path: |
            ${{ runner.temp }}/work/out
            ${{ runner.temp }}/work/plan.json
            ${{ runner.temp }}/work/reports
          if-no-files-found: warn

      - name: Publish to release
        # Only a successful merge has anything worth publishing. `always()` here
        # meant a cancelled run shipped a release whose every chunk kept the
        # original audio — a "dub" with no dub in it.
        if: success() && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: dub-${{ github.run_number }}-${{ github.run_attempt }}
          TITLE: ${{ inputs.output_name != '' && inputs.output_name || 'Dub' }} → ${{ inputs.target_lang }}
          SOURCE: ${{ inputs.video_url }}
          CHUNKS: ${{ steps.merge.outputs.chunks }}
          DUBBED: ${{ steps.merge.outputs.dubbed }}
          ORIGINAL: ${{ steps.merge.outputs.original_audio }}
          DURATION: ${{ steps.merge.outputs.duration }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=("$WORK_DIR"/out/*.mp4 "$WORK_DIR"/out/*.mp3)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing to publish (merge produced no output)"
            exit 0
          fi

          printf -v notes 'Dubbed with Rask (audio only).\n\n- source: %s\n- target: %s\n- duration: %ss\n- chunks: %s (dubbed %s, kept original %s)\n- run: %s\n' \
            "$SOURCE" "$TARGET_LANG" "${DURATION:-?}" "${CHUNKS:-?}" "${DUBBED:-?}" "${ORIGINAL:-?}" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          ls -lh "${files[@]}"
          gh release create "$TAG" "${files[@]}" --title "$TITLE" --notes "$notes" --latest=false
          echo "published $TAG: ${files[*]}"

      - name: Summary
        if: always()
        run: |
          {
            echo '### Result'
            echo ''
            echo "- video: \`${{ steps.merge.outputs.video_path }}\`"
            echo "- audio: \`${{ steps.merge.outputs.audio_path }}\`"
            echo "- duration: ${{ steps.merge.outputs.duration }}s"
            echo "- chunks: ${{ steps.merge.outputs.chunks }} (dubbed ${{ steps.merge.outputs.dubbed }}, original ${{ steps.merge.outputs.original_audio }})"
            echo "- accounts: ${{ steps.merge.outputs.accounts }}"
            echo "- still missing: \`${{ steps.merge.outputs.missing }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
